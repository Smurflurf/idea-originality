<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
	<div class="menu-wrapper" th:fragment="sideMenu">

		<!-- 1. Hamburger Button -->
		<button id="menu-trigger" class="menu-trigger"
			aria-label="Menü öffnen">
			<i class="fa-solid fa-bars"></i>
		</button>

		<!-- 2. Overlay Hintergrund -->
		<div id="menu-overlay" class="menu-overlay"></div>

		<!-- 3. Das eigentliche Menü -->
		<aside id="sidebar-menu" class="sidebar-menu">
			<!-- 1. Close Button: Jetzt mit Hamburger Icon -->
			<button id="menu-close-btn" class="menu-close-btn">
				<i class="fa-solid fa-bars"></i>
			</button>

			<!-- Home Button (bleibt oben und groß) -->
			<a th:href="@{/}" class="main-nav-link"><i
				class="fa-solid fa-house"></i> <span data-i18n="menu.home">Home</span></a>

			<hr
				style="border: 0; height: 1px; background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent); margin: 20px 0;">

			<!-- History Container -->
			<div id="menu-history-container"></div>


			<div id="translate-menu-wrapper" class="theme-menu-wrapper">
				<div id="translate-main-btn" class="theme-main-btn">
					<div class="theme-main-btn-content">
						<i class="fa-solid fa-language theme-icon"></i> <span
							data-i18n="menu.translate">Translate</span>
					</div>
					<i class="fa-solid fa-chevron-right theme-arrow"></i>
				</div>

				<div id="translate-submenu" class="theme-submenu">
					<!-- 1. Select Text Button -->
					<button id="translate-mode-btn" class="mode-toggle-btn"
						data-tippy-content="Click to enter translate mode, then select text on the page.">
						<span><i class="fa-solid fa-i-cursor"></i> <span
							data-i18n="menu.select_text">Select Text</span></span> <i
							id="translate-active-indicator"
							class="fa-solid fa-check check-icon"></i>
					</button>

					<!-- 1b. Read Text Button (TTS) -->
					<button id="read-text-mode-btn" class="mode-toggle-btn"
						data-tippy-content="Click to enter reading mode, then select text to listen to it.">
						<span><i class="fa-solid fa-volume-high"></i> <span
							data-i18n="menu.read_text">Read Aloud</span></span> <i
							id="read-active-indicator" class="fa-solid fa-check check-icon"></i>
					</button>


					<hr
						style="margin: 8px 0 4px 0; border: 0; border-top: 1px solid var(--border-subtle);">

					<!-- 2. Label (kurz und bündig) -->
					<div class="menu-section-label" data-i18n="menu.translate_to">Translate
						to</div>

					<!-- 3. System (Angepinnt, immer oben) -->
					<button class="theme-submenu-item language-option"
						data-lang="system">
						<span><i class="fa-solid fa-laptop"></i> <span
							data-i18n="menu.system">System</span></span> <i
							class="fa-solid fa-check check-icon" style="opacity: 1;"></i>
					</button>

					<!-- 4. Suchfeld -->
					<div class="language-search-wrapper">
						<i class="fa-solid fa-magnifying-glass search-icon"></i> <input
							type="text" id="language-filter-input" placeholder="Search..."
							data-i18n="menu.search_placeholder" autocomplete="off">
					</div>

					<!-- 5. Scrollbare Liste (nur für die vielen Sprachen) -->
					<div id="translate-language-list">
						<!-- Wird von JS befüllt -->
					</div>

					<!-- DATEN INJEKTION -->
					<script th:inline="javascript">
						/*<![CDATA[*/
						window.SERVER_LANGUAGES = JSON
								.parse(/*[[${supportedLanguagesJson}]]*/'[]');
						/*]]>*/
					</script>
				</div>
			</div>

			<!-- 2. Footer Bereich: Klein, unten, ohne Icons -->
			<div class="sidebar-footer">
				<a th:href="@{/impressum}" data-i18n="footer.impressum">Imprint</a>
				<span class="footer-separator">&bull;</span> <a
					th:href="@{/privacy}" data-i18n="footer.privacy">Privacy Policy</a>
				<span class="footer-separator">&bull;</span> <a
					th:href="@{/licenses}" data-i18n="footer.licenses">Licenses</a>
			</div>

		</aside>

	</div>


	<th:block th:fragment="importMapScript">
		<!-- 
            ANTI-FLICKER SCRIPT 
            Muss VOR allem CSS und anderen JS ausgeführt werden. 
            Es liest das Theme aus und setzt das Attribut auf <html>, bevor gerendert wird.
        -->
		<script>
			(function() {
				try {
					var storageKey = 'ideenatlas-theme';
					var theme = localStorage.getItem(storageKey) || 'system';

					if (theme === 'system') {
						var systemDark = window
								.matchMedia('(prefers-color-scheme: dark)').matches;
						theme = systemDark ? 'dark' : 'light';
					}

					// Setzt das Attribut sofort auf das <html> Element (documentElement)
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
				}
			})();
		</script>

		<script type="importmap" th:inline="javascript">
    	{
        "imports": {
        "/dist/main.js": [[@{/dist/boot/main.js(v=${appVersion})}]],
        "/dist/index.js": [[@{/dist/boot/index.js(v=${appVersion})}]],

        "/dist/localization.js": [[@{/dist/core/localization.js(v=${appVersion})}]],
        "/dist/security.js": [[@{/dist/core/security.js(v=${appVersion})}]],
        "/dist/fps.js": [[@{/dist/core/fps.js(v=${appVersion})}]],
        "/dist/context.js": [[@{/dist/core/context.js(v=${appVersion})}]],

        "/dist/idb-helper.js": [[@{/dist/data/idb-helper.js(v=${appVersion})}]],
        "/dist/pageCache.js": [[@{/dist/data/pageCache.js(v=${appVersion})}]],

        "/dist/themeSwitch.js": [[@{/dist/ui/base/themeSwitch.js(v=${appVersion})}]],

        "/dist/cardOptimizer.js": [[@{/dist/ui/base/cardOptimizer.js(v=${appVersion})}]],
        "/dist/colorCoder.js": [[@{/dist/ui/base/colorCoder.js(v=${appVersion})}]],

        "/dist/menu.js": [[@{/dist/ui/navigation/menu.js(v=${appVersion})}]],
        "/dist/navigation.js": [[@{/dist/ui/navigation/navigation.js(v=${appVersion})}]],

        "/dist/hierarchyToggle.js": [[@{/dist/ui/interaction/hierarchyToggle.js(v=${appVersion})}]],

        "/dist/zoomAndPan.js": [[@{/dist/viz/core/zoomAndPan.js(v=${appVersion})}]],

        "/dist/exportVisualization.js": [[@{/dist/viz/core/exportVisualization.js(v=${appVersion})}]],

        "/dist/clickablePoints.js": [[@{/dist/viz/render/clickablePoints.js(v=${appVersion})}]],

        "/dist/animationConfig.js": [[@{/dist/animation/config.js(v=${appVersion})}]],

        "/dist/cloudSimulator.js": [[@{/dist/animation/cloudSimulator.js(v=${appVersion})}]],
        "/dist/textAnimator.js": [[@{/dist/animation/textAnimator.js(v=${appVersion})}]],
        "/dist/preRenderer.js": [[@{/dist/animation/preRenderer.js(v=${appVersion})}]],

        "/dist/handleQuery.js": [[@{/dist/features/query/handleQuery.js(v=${appVersion})}]],

        "/dist/queryButtonManager.js": [[@{/dist/features/query/queryButtonManager.js(v=${appVersion})}]],
        "/dist/filteredResultsLoader.js": [[@{/dist/features/query/filteredResultsLoader.js(v=${appVersion})}]],

        "/dist/mediaActions.js": [[@{/dist/features/media/mediaActions.js(v=${appVersion})}]],
        "/dist/handleUpload.js": [[@{/dist/features/media/handleUpload.js(v=${appVersion})}]],
        "/dist/handleRecord.js": [[@{/dist/features/media/handleRecord.js(v=${appVersion})}]],
        "/dist/attachmentManager.js": [[@{/dist/features/media/attachmentManager.js(v=${appVersion})}]],

        "/dist/translate.js": [[@{/dist/features/accessibility/translate.js(v=${appVersion})}]],
        "/dist/tts.js": [[@{/dist/features/accessibility/tts.js(v=${appVersion})}]],

        "/dist/downloadManager.js": [[@{/dist/features/export/downloadManager.js(v=${appVersion})}]]
    	}
    	}
    	</script>

		<!-- 2. SERVICE WORKER REGISTRIERUNG -->
		<script type="module">
    if ('serviceWorker' in navigator) {
        
        // --- 1. ERROR REPORTING ---
        navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'INSTALL_ERROR') {
                console.group('%c Service Worker Installation Failed ', 'background: red; color: white; font-size: 14px; padding: 4px;');
                console.error('Die folgende Datei konnte nicht geladen werden:');
                console.log(`%c ${event.data.file}`, 'font-weight: bold; color: yellow;');
                console.log(`Status: ${event.data.status}`);
                console.log('Dies verhindert das Update. Der alte SW bleibt aktiv.');
                console.groupEnd();
            }
        });

        let refreshing = false;

        // --- 2. UPDATE STRATEGIE (Auto-Reload) ---
        // Feuert, wenn der neue SW durch 'skipWaiting' & 'clients.claim' die Kontrolle übernommen hat.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                console.log("[App] Update installiert. Seite wird neu geladen...");
                refreshing = true;
                window.location.reload();
            }
        });

        // --- 3. REGISTRIERUNG ---
        window.addEventListener('load', async () => {
            try {
                // updateViaCache: 'none' zwingt den Browser, die Datei sw.js IMMER 
                // vom Server zu prüfen, nicht aus dem Browser-Cache.
                const registration = await navigator.serviceWorker.register('/sw.js', { 
                    updateViaCache: 'none' 
                });

                console.log('[App] SW registered. Scope:', registration.scope);

                // Optionale Sicherheit: Manuelles Update anstoßen
                // Falls der Browser denkt, er müsse sw.js nicht prüfen.
                registration.update();

            } catch (error) {
                console.error('[App] SW Registration failed:', error);
            }
        });
    }
		</script>

		<script type="module">
            // Wir importieren die Datei nur, um sicherzustellen, dass sie geladen wird.
            // Durch die ImportMap wird daraus '/dist/localization.js?v=...'
            import '/dist/localization.js';
            
            // Jetzt rufen wir die Funktion sicher über das Window-Objekt auf.
            // Das funktioniert auch, wenn Vite die interne Funktion in 'a()' umbenannt hat.
            if (typeof window.loadFromCacheInstant === 'function') {
                window.loadFromCacheInstant();
            }
        </script>
	</th:block>
</body>
</html>
