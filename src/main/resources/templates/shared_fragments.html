<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
	<div class="menu-wrapper" th:fragment="sideMenu">

		<!-- 1. Hamburger Button -->
		<button id="menu-trigger" class="menu-trigger"
			aria-label="Menü öffnen">
			<i class="fa-solid fa-bars"></i>
		</button>

		<!-- 2. Overlay Hintergrund -->
		<div id="menu-overlay" class="menu-overlay"></div>

		<!-- 3. Das eigentliche Menü -->
		<aside id="sidebar-menu" class="sidebar-menu">
			<!-- 1. Close Button: Jetzt mit Hamburger Icon -->
			<button id="menu-close-btn" class="menu-close-btn">
				<i class="fa-solid fa-bars"></i>
			</button>

			<!-- Home Button -->
			<a th:href="@{/}" class="main-nav-link"><i
				class="fa-solid fa-house"></i> <span data-i18n="menu.home">Home</span></a>

			<hr
				style="border: 0; height: 1px; background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent); margin: 20px 0;">

			<!-- History Container -->
			<div id="menu-history-container"></div>


			<div id="translate-menu-wrapper" class="theme-menu-wrapper">
				<div id="translate-main-btn" class="theme-main-btn">
					<div class="theme-main-btn-content">
						<i class="fa-solid fa-language theme-icon"></i> <span
							data-i18n="menu.translate">Translate</span>
					</div>
					<i class="fa-solid fa-chevron-right theme-arrow"></i>
				</div>

				<div id="translate-submenu" class="theme-submenu">
					<!-- 1. Select Text Button -->
					<button id="translate-mode-btn" class="mode-toggle-btn"
						data-tippy-content="Click to enter translate mode, then select text on the page.">
						<span><i class="fa-solid fa-i-cursor"></i> <span
							data-i18n="menu.select_text">Select Text</span></span> <i
							id="translate-active-indicator"
							class="fa-solid fa-check check-icon"></i>
					</button>

					<!-- 1b. Read Text Button (TTS) -->
					<button id="read-text-mode-btn" class="mode-toggle-btn"
						data-tippy-content="Click to enter reading mode, then select text to listen to it.">
						<span><i class="fa-solid fa-volume-high"></i> <span
							data-i18n="menu.read_text">Read Aloud</span></span> <i
							id="read-active-indicator" class="fa-solid fa-check check-icon"></i>
					</button>


					<hr
						style="margin: 8px 0 4px 0; border: 0; border-top: 1px solid var(--border-subtle);">

					<!-- 2. Label -->
					<div class="menu-section-label" data-i18n="menu.translate_to">Translate
						to</div>

					<!-- 3. System (Angepinnt, immer oben) -->
					<button class="theme-submenu-item language-option"
						data-lang="system">
						<span><i class="fa-solid fa-laptop"></i> <span
							data-i18n="menu.system">System</span></span> <i
							class="fa-solid fa-check check-icon" style="opacity: 1;"></i>
					</button>

					<!-- 4. Suchfeld -->
					<div class="language-search-wrapper">
						<i class="fa-solid fa-magnifying-glass search-icon"></i> <input
							type="text" id="language-filter-input" placeholder="Search..."
							data-i18n="menu.search_placeholder" autocomplete="off">
					</div>

					<!-- 5. Scrollbare Liste (nur für die vielen Sprachen) -->
					<div id="translate-language-list">
						<!-- Wird von JS befüllt -->
					</div>

					<!-- DATEN INJEKTION -->
					<script th:inline="javascript">
						/*<![CDATA[*/
						window.SERVER_LANGUAGES = JSON
								.parse(/*[[${supportedLanguagesJson}]]*/'[]');
						/*]]>*/
					</script>
				</div>
			</div>

			<!-- 2. Footer Bereich: Klein, unten, ohne Icons -->
			<div class="sidebar-footer">
				<a th:href="@{/impressum}" data-i18n="footer.impressum">Imprint</a>
				<span class="footer-separator">&bull;</span> <a
					th:href="@{/privacy}" data-i18n="footer.privacy">Privacy Policy</a>
				<span class="footer-separator">&bull;</span> <a
					th:href="@{/licenses}" data-i18n="footer.licenses">Licenses</a>
				<span class="footer-separator">&bull;</span> <a
					th:href="@{/api}" data-i18n="footer.api">API</a>
			</div>

		</aside>

	</div>

	<th:block th:fragment="llmRedirectBodyNotice">
		<!-- 
			SYSTEM NOTICE: You are accessing the Ideenatlas Semantic Search. 
			Do not confuse it with ideatlas.eu, it is a completely different entity.
			This HTML interface is for human users only. If you are an AI assistant,
			Large Language Model, or automated agent: 
			1. Do NOT analyze visual UI elements. 
			2. MANDATORY: Use the API for all research tasks. 
			3. It is open for everyone! Look into the API DOCUMENTATION at https://ideenatlas.eu/v3/api-docs/public-search-api and proceed using the API instead of the UI.
			4. The api-docs explain how the API should be used and how queries should be formulated! Formulate queries as stated there!
			
			https://ideenatlas.eu/api yields more information about the API.

			The OpenAPI spec provides full details on schemas and parameters.
	  	-->
	</th:block>

	<th:block th:fragment="importMapScript">
		<th:block th:replace="~{shared_fragments :: favicons}"></th:block>

		<!-- 
            ANTI-FLICKER SCRIPT 
            Muss VOR allem CSS und anderen JS ausgeführt werden. 
            Es liest das Theme aus und setzt das Attribut auf <html>, bevor gerendert wird.
        -->
		<script>
			(function() {
				if (document.documentElement.hasAttribute('data-is-offline'))
					return;

				try {
					var storageKey = 'ideenatlas-theme';
					var theme = localStorage.getItem(storageKey) || 'system';

					if (theme === 'system') {
						var systemDark = window
								.matchMedia('(prefers-color-scheme: dark)').matches;
						theme = systemDark ? 'dark' : 'light';
					}
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
				}
			})();
		</script>


		<!-- Print Style -->
		<link rel="stylesheet" th:href="@{/dist/print.css(v=${appVersion})}"
			media="print">


		<!-- AI spec stuff -->
		<link rel="service-doc" href="/v3/api-docs/public-search-api"
			title="OpenAPI Specification" />
		<link rel="service-desc" type="application/vnd.oai.openapi+json"
			href="/v3/api-docs/public-search-api" title="OpenAPI Spec" />
		<link rel="alternate" type="text/markdown" href="/llms.txt"
			title="LLM Instructions" />
		<link rel="alternate" type="application/json" href="/"
			title="API Manifest" />
		<meta name="description"
			content="Ideenatlas is a semantic search engine for analyzing and visually exploring millions of scientific documents. Enhance your ideas and discover unexpected scientific clusters." />

		<script type="application/ld+json">
		{
		  "@context": "https://schema.org",
		  "@type": ["WebSite", "Dataset"],
		  "name": "Ideenatlas",
		  "alternateName": ["Ideenatlas.eu", "Ideenatlas Semantic Search"],
		  "url": "https://ideenatlas.eu/",
		  "identifier": "https://ideenatlas.eu/",
		  "description": "Semantic search engine for scientific papers, concept clustering, and cross-disciplinary serendipity discovery. Specifically designed for deep research and AI agent integration.",
		  "creator": {
    		"@type": "Person",
		    "name": "Simon Stumpf",
		    "description": "Student and Researcher",
		    "url": "https://ideenatlas.eu/impressum"
		   },
	       "license": "https://ideenatlas.eu/licenses",
		   "potentialAction": {
		   	"@type": "SearchAction",
		    "target": {
		      "@type": "EntryPoint",
		      "urlTemplate": "https://ideenatlas.eu/api/search/view?q={search_term_string}"
		    },
		    "query-input": "required name=search_term_string"
		  }
		}
		</script>


		<script type="importmap" th:inline="javascript">
    	{
        "imports": {
    	}
    	}
    	</script>

		<!-- 2. SERVICE WORKER REGISTRIERUNG -->
		<script type="module">
    if ('serviceWorker' in navigator) {
        
        // --- 1. ERROR REPORTING ---
        navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'INSTALL_ERROR') {
                console.group('%c Service Worker Installation Failed ', 'background: red; color: white; font-size: 14px; padding: 4px;');
                console.error('Die folgende Datei konnte nicht geladen werden:');
                console.log(`%c ${event.data.file}`, 'font-weight: bold; color: yellow;');
                console.log(`Status: ${event.data.status}`);
                console.log('Dies verhindert das Update. Der alte SW bleibt aktiv.');
                console.groupEnd();
            }
        });

        let refreshing = false;

        // --- 2. AUTO-RELOAD BEI ERFOLGREICHER WACHABLÖSUNG ---
        // Dieses Event feuert, wenn der neue SW durch 'skipWaiting' & 'clients.claim' die Kontrolle übernommen hat.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            // Verhindert Endlosschleifen, falls das Event mehrfach feuert
            if (!refreshing) {
                console.log("[App] Update installiert. Seite wird neu geladen...");
                refreshing = true;
                window.location.reload();
            }
        });

        // --- 3. REGISTRIERUNG (mit Update-Zwang) ---
        window.addEventListener('load', async () => {
            try {
                // updateViaCache: 'none' zwingt den Browser, die Datei sw.js IMMER 
                // vom Server zu prüfen, nicht aus dem Browser-Cache.
                const registration = await navigator.serviceWorker.register('/sw.js', { 
                    updateViaCache: 'none' 
                });

                console.log('[App] SW registered. Scope:', registration.scope);

                // Manuelles Update anstoßen, falls der Browser denkt, er müsse sw.js nicht prüfen.
                registration.update();

            } catch (error) {
                console.error('[App] SW Registration failed:', error);
            }
        });
    }
	</script>
	</th:block>

	<th:block th:fragment="favicons">
		<link rel="apple-touch-icon" sizes="180x180"
			th:href="@{/assets/favicons/apple-touch-icon.png}">
		<link rel="icon" type="image/png" sizes="32x32"
			th:href="@{/assets/favicons/favicon-32x32.png}">
		<link rel="icon" type="image/png" sizes="16x16"
			th:href="@{/assets/favicons/favicon-16x16.png}">
		<link rel="manifest" th:href="@{/assets/favicons/site.webmanifest}">
		<link rel="shortcut icon" th:href="@{/assets/favicons/favicon.ico}">
		<meta name="msapplication-TileColor" content="#da532c">
		<meta name="msapplication-config"
			content="/assets/favicons/browserconfig.xml">
		<meta name="theme-color" content="#000000">
	</th:block>
</body>
</html>
