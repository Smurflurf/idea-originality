<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">

<base th:href="@{/}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Ideenatlas</title>
<th:block th:replace="~{collected_imports :: generalHeadImports}"></th:block>

<!-- STYLESHEETS -->
<link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css(v=${appVersion})}">
<link rel="stylesheet" th:href="@{/dist/menu.css(v=${appVersion})}">
<link rel="stylesheet" th:href="@{/vendor/fonts/roboto.css(v=${appVersion})}">
    
<!-- 2. Tippy & Popper -->
<link rel="stylesheet" th:href="@{/vendor/tippy/tippy.css(v=${appVersion})}">
<script th:src="@{/vendor/tippy/popper.min.js(v=${appVersion})}"></script>
<script th:src="@{/vendor/tippy/tippy-bundle.umd.min.js(v=${appVersion})}"></script>

<!-- 3. KaTeX -->
<link rel="stylesheet" th:href="@{/vendor/katex/katex.min.css(v=${appVersion})}">
<script defer th:src="@{/vendor/katex/katex.min.js(v=${appVersion})}"></script>
<script defer th:src="@{/vendor/katex/contrib/auto-render.min.js(v=${appVersion})}" 
        onload="renderMathInElement(document.body);"></script>

</head>

<body class="is-scrolling-content is-loading" data-features="visualization, results-meta">
    <th:block th:replace="~{collected_imports :: generalBodyImports}"></th:block>

	<div class="results-container" th:if="${isDataAvailable}">
		<div class="viz-toggle-header">
			<h3 id="show-own-viz" class="viz-toggle-btn active"
				data-i18n="tabs.own_idea">Your Idea</h3>
			<span class="viz-separator">|</span>
			<h3 id="show-neighbor-viz" class="viz-toggle-btn"
				data-i18n="tabs.similar_topics">Similar Topics</h3>
			<span class="viz-separator">|</span>
			<h3 id="show-serendipity-viz" class="viz-toggle-btn"
				data-i18n="tabs.serendipity">Serendipity</h3>
		</div>

		<!--  fragments from result_fragments.html -->
		<div th:replace="~{result_fragments :: ownIdeaView}"></div>
		<div th:replace="~{result_fragments :: neighborClusterView}"></div>
		<div th:replace="~{result_fragments :: serendipityView}"></div>
	</div>


	<div class="no-results-message" th:unless="${isDataAvailable}">
		<i class="fa-solid fa-triangle-exclamation"></i>
		<h2 data-i18n="errors.job_not_found_title">Error: Job data not
			found</h2>
		<p>
			<span data-i18n="errors.job_not_found_text">The results for this job have expired or could not be found.</span>
			<br> Please <a
				href="https://ideenatlas.eu" class="source-link"
				data-i18n="errors.start_new_query">start a new query</a>.
		</p>
	</div>

    <!-- UNSER SCROLL-PROXY (Geister-Element) -->
	<div id="scroll-proxy" style="position: absolute; top: 0; left: 0; width: 1px; z-index: -1; visibility: hidden;"></div>


	<!-- INLINE SCRIPTS -->
	<script id="initial-data-script" type="module" th:inline="javascript">
		/*<![CDATA[*/
        const INITIAL_DATA = {
            JOB_ID: /*[[${jobId}]]*/ null,
            IS_DATA_AVAILABLE: /*[[${isDataAvailable}]]*/ false,
			JOB_TITLE: /*[[${jobTitle}]]*/ 'Analysis', 
            QUERY_VECTOR: /*[[${queryVectorJson}]]*/null,
            OWN_IDEA_COLOR_MAP: JSON.parse(/*[[${ownColorMapJson}]]*/'{}'),
            OWN_RESULTS_DATA: JSON.parse(/*[[${ownResultsJson}]]*/'[]'),
			NEIGHBOR_CLUSTER_COLOR_MAP: JSON.parse(/*[[${neighborsclusterColorMapJson}]]*/'{}'),
            CROSSHAIR_COORDS: JSON.parse(/*[[${crosshairCoordsJson}]]*/'null'),
			EMBEDDING_BOUNDS: JSON.parse(/*[[${embeddingBoundsJson}]]*/'null'),
        	OUTLINE_DATA: JSON.parse(/*[[${outlinesJson}]]*/'{}'),
        	OWN_LABELS_DATA: JSON.parse(/*[[${ownLabelsJson}]]*/'[]'),
        	NEIGHBOR_LABELS_DATA: JSON.parse(/*[[${neighborLabelsJson}]]*/'[]'),
        	CONTEXT_LABELS_DATA: JSON.parse(/*[[${contextLabelsJson}]]*/'[]'),
			SERENDIPITY_RESULTS: JSON.parse(/*[[${serendipityResultsJson}]]*/'[]'),
			SERENDIPITY_COLOR_MAP: JSON.parse(/*[[${serendipityColorMapJson}]]*/'{}'),
			SERENDIPITY_LABELS_DATA: JSON.parse(/*[[${serendipityLabelsJson}]]*/'[]')
        };

		window.INITIAL_DATA = INITIAL_DATA;

        for (const key in INITIAL_DATA) {
            window[key] = INITIAL_DATA[key];
        }

		/*]]>*/
	</script>

	<!-- Central Entrypoint -->
	<script type="module" th:src="@{/dist/main.js(v=${appVersion})}" defer></script>
</body>

</html>
