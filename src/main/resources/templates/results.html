<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Originality Results</title>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
    <link rel="stylesheet" th:href="@{/styling/style.css}">
    <link rel="stylesheet" th:href="@{/styling/results.css}">
    <link rel="stylesheet" th:href="@{/styling/tooltips.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"
        integrity="sha384-KiWOvVjnN8qwZuNíjP8LPqMgiT1rV3DPeiQAyUKEuRplZvClMbMguC4mMwgVGZVw" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"
        integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1gAUAANpJJvCkh3fOHT5Pa4ob6/0ZgQ4KEhHxTBrs0"
        crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
        integrity="sha384-43gBJIJTA_i6yr0pAi8srxRfGyA/bklvEaY_BwJ0mKx//ZNVEhP_RzrlRopTCeVH"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
</head>

<body>

    <div class="results-container">
        <h1>Extracted idea:</h1>
        <p th:text="${query}"></p>
        <hr style="border-color: #5f6368; margin: 30px 0;">
        <h2>Similar results:</h2>

        <div th:if="${results == null || results.isEmpty()}">
            <p>No similar results found in the database.</p>
        </div>

        <div th:unless="${results == null || results.isEmpty()}">
            <div th:each="result, iterStat : ${results}" class="result-card">
                <div class="result-header">
                    <span class="result-score"
                        th:text="'Score: ' + ${#numbers.formatDecimal(result.score, 1, 4)}"></span>
                    <a class="source-link" 
                        th:href="${result.contentUrl}" 
                        th:text="${result.payload.get('type')}"
                        target="_blank"
                        data-tippy-content="open source paper/post"></a>
                </div>

                <div class="result-summary">
                    <h3 th:utext="${result.payload.get('title')}"></h3>
                    <p class="expandable-abstract" 
                        th:utext="${result.get('payload').get('abstract')}"></p>
                </div>

                <button class="toggle-json-btn" data-tippy-content="show/hide raw JSON">
                    <i class="fa-solid fa-caret-right arrow"></i>
                </button>


                <div class="result-payload" th:id="'payload-' + ${iterStat.index}">
                    <pre><th:block th:utext="${result.payload.get('prettyJson')}"/></pre>
                </div>


            </div>
        </div>
    </div>

    <script>
        function toggleJsonView(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                if (element.style.display === 'none') {
                    element.style.display = 'block';
                } else {
                    element.style.display = 'none';
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            renderMathInElement(document.body, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false
            });
        });
    </script>
    <script type="module" th:src="@{/script/toggleAbstractButton.js}"></script>
    <script type="module" th:src="@{/script/toggleButton.js}"></script>
    <script type="module" th:src="@{/script/tooltips.js}"></script>
</body>

</html>
